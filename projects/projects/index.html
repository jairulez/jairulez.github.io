<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jay's projects</title><meta name="description" content="Public links and status for projects by Jay V."><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#251f21;background:#f7f4f1}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:30px auto;padding:36px;background:#fff;border-radius:18px}h1{font-family:Georgia,serif;font-weight:400;font-size:38px;letter-spacing:-.025em;margin:0}h2{font-size:19px;margin:3px 0}p{line-height:1.55}a{color:#296e68;text-underline-offset:3px}small,.muted{color:#585254}.intro{margin:12px 0 20px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.stats span,.status{border:1px solid #eae9ea;border-radius:5px;padding:7px 10px;font-size:13px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:30px 0 22px}.tools button,.tools input{font:inherit;padding:10px 12px;border:1px solid #d9d6d5;border-radius:5px;background:#fff;min-height:44px}.tools button{cursor:pointer}.tools button[aria-pressed=true]{background:#251f21;color:white}.tools input{margin-left:auto;min-width:190px}.card{border-top:1px solid #eae9ea;padding:20px 0}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:11px;color:#585254}.status{white-space:nowrap;color:#585254}.card p{margin:10px 0}.meta{font-size:12px;color:#585254}.links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:12px}.empty{padding:25px 0;color:#585254}footer{border-top:1px solid #eae9ea;padding-top:20px;color:#585254;font-size:13px}@media(max-width:600px){main{margin:0;padding:24px;border-radius:0}h1{font-size:30px}.head{display:block}.status{display:inline-block;margin-top:8px}.tools input{margin-left:0;width:100%}}
</style></head><body><main><header><h1>Jay's projects</h1><p class="intro">Public project pages, channels and current status in one place.</p><small id="updated">Loading latest snapshot…</small></header><div class="stats" id="stats"></div><nav class="tools" aria-label="Project filters"><button type="button" data-filter="All" aria-pressed="true">All</button><button type="button" data-filter="Running" aria-pressed="false">Running</button><button type="button" data-filter="Needs Jay" aria-pressed="false">In progress</button><button type="button" data-filter="Waiting" aria-pressed="false">Waiting</button><input id="search" type="search" placeholder="Search projects" aria-label="Search projects"></nav><section id="projects" aria-live="polite"></section><footer>These are snapshots, not live operational data. Links open the project's public page. No private account or client details are shown.</footer></main><script>
const state={data:null,filter:'All',query:''};const $=s=>document.querySelector(s);function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text)x.textContent=text;return x}function date(v){return new Intl.DateTimeFormat('en-IN',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Kolkata'}).format(new Date(v))+' IST'}function render(){const d=state.data;if(!d)return;$('#updated').textContent='Snapshot checked '+date(d.generatedAt);const stats=$('#stats');stats.replaceChildren();stats.append(el('span','',d.projects.length+' projects tracked'),el('span','',d.projects.filter(p=>p.stage==='Running').length+' running'));const box=$('#projects');box.replaceChildren();const items=d.projects.filter(p=>(state.filter==='All'||p.stage===state.filter)&&JSON.stringify([p.name,p.status,p.description]).toLowerCase().includes(state.query));if(!items.length){box.append(el('p','empty','No matching projects.'));return}for(const p of items){const c=el('article','card');const head=el('div','head');const title=el('div');title.append(el('span','eyebrow',p.category),el('h2','',p.name));head.append(title,el('span','status',p.status));c.append(head,el('p','',p.description),el('div','meta','Status checked '+date(p.updatedAt)));if(p.links.length){const links=el('div','links');for(const l of p.links){const a=el('a','',l.label);a.href=l.url;a.rel='noopener noreferrer';a.target='_blank';links.append(a)}c.append(links)}box.append(c)}}document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(v=>v.setAttribute('aria-pressed',String(v===b)));render()}));$('#search').addEventListener('input',e=>{state.query=e.target.value.toLowerCase();render()});fetch('./data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{state.data=d;render()}).catch(()=>{$('#updated').textContent='Could not load the project snapshot. Please reload.'});
</script></body></html>
